<style>
    body { font-family: 'Public Sans', sans-serif; background-color: #f9f9fc; color: #1a1c1e; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .page { display: none; }
    .page.active { display: block; }
    .nav-link.active { color: #005566 !important; font-weight: 700 !important; background-color: #dae1e3 !important; border-left: 4px solid #005566 !important; }
    .canvas-grid { background-image: radial-gradient(#DDE1E4 1px, transparent 1px); background-size: 24px 24px; }
    .node-pulse { animation: pulse-ring 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse-ring { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.05); opacity: 0.2; } 100% { transform: scale(0.95); opacity: 0.5; } }
    .drawer-transition { transition: transform 0.4s cubic-bezier(0.16,1,0.3,1); }
    .gradient-card { position: relative; overflow: hidden; }
    .gradient-card::before { content: ''; position: absolute; top: 0; right: 0; width: 8rem; height: 8rem; border-radius: 0 0 0 100%; opacity: 0.08; z-index: 0; transition: transform 0.3s; }
    .gradient-card:hover::before { transform: scale(1.1); }
    .gradient-card > * { position: relative; z-index: 1; }
    .tab-transition { transition: all 0.2s ease; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f3f3f6; }
    ::-webkit-scrollbar-thumb { background: #bfc8cb; border-radius: 3px; }
    .member-drawer-open { overflow: hidden; }
</style>
</head>
<body class="bg-background text-on-background antialiased">
<!-- App -->
<div id="app"></div>

<script>
// ===== PORTAL DATA =====
const PORTAL_DATA = null; // loaded from JSON

async function init() {
    const resp = await fetch('voyce_portal_data.json');
    const data = await resp.json();
    renderApp(data);
}

// ===== RENDER HELPERS =====
function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
            if (k === 'className') el.className = v;
            else if (k === 'innerHTML') el.innerHTML = v;
            else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
            else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
            else el.setAttribute(k, v);
        }
    }
    for (const c of children) {
        if (c == null) continue;
        el.append(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
}

function initials(name) {
    if (!name || typeof name !== 'string') return '??';
    return name.split(' ').map(w => w && w[0]).filter(Boolean).join('').slice(0, 2).toUpperCase();
}

function memberInitials(name) {
    return initials(name);
}

function getInitialsColor(name) {
    const colors = ['bg-policy-blue/20 text-policy-blue', 'bg-tertiary-container/20 text-tertiary-container', 'bg-policy-mint/30 text-primary', 'bg-secondary-container/50 text-primary', 'bg-primary-container/20 text-primary-container'];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}

function truncate(str, len) {
    if (!str) return '';
    return str.length > len ? str.slice(0, len) + '…' : str;
}

function bioPreview(bio) {
    if (!bio) return 'No biography available.';
    return truncate(bio, 200);
}

// ===== NAVIGATION =====
function navigate(page, state) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    const pageEl = document.getElementById('page-' + page);
    if (pageEl) pageEl.classList.add('active');
    const link = document.querySelector(`[data-page="${page}"]`);
    if (link) link.classList.add('active');
    window.scrollTo(0, 0);
}

// ===== DRAWER STATE =====
let currentMember = null;

function openDrawer(member) {
    currentMember = member;
    const drawer = document.getElementById('member-drawer');
    const overlay = document.getElementById('drawer-overlay');
    if (!drawer || !overlay) return;
    drawer.classList.remove('translate-x-full');
    overlay.classList.remove('opacity-0', 'pointer-events-none');
    document.body.classList.add('member-drawer-open');
    renderDrawerContent(member);
}

function closeDrawer() {
    const drawer = document.getElementById('member-drawer');
    const overlay = document.getElementById('drawer-overlay');
    if (!drawer || !overlay) return;
    drawer.classList.add('translate-x-full');
    overlay.classList.add('opacity-0', 'pointer-events-none');
    document.body.classList.remove('member-drawer-open');
}

function renderDrawerContent(member) {
    const container = document.getElementById('drawer-content');
    if (!container) return;
    container.innerHTML = '';
    const tags = [
        ...(member.interests ? member.interests.split(/[,;]/).map(s => s.trim()) : []),
        ...(member.field_of_studies ? member.field_of_studies.split(/[,;]/).map(s => s.trim()) : []),
        ...(member.companies ? member.companies.split(/[,;]/).map(s => s.trim()) : [])
    ].filter(Boolean);
    const uniqueTags = [...new Set(tags)];
    const articles = member.article_titles ? member.article_titles.split('|').map(s => s.trim()).filter(Boolean) : [];
    
    container.append(
        h('div', { className: 'flex justify-between items-start mb-8' },
            h('button', { className: 'p-2 hover:bg-surface-subtle rounded-full text-on-surface-variant transition-colors', onClick: closeDrawer },
                h('span', { className: 'material-symbols-outlined', innerHTML: 'close' })
            ),
            h('div', { className: 'flex gap-2' },
                h('button', { className: 'p-2 border border-border-low hover:bg-surface-subtle rounded-xl text-on-surface-variant transition-colors' },
                    h('span', { className: 'material-symbols-outlined', innerHTML: 'share' })
                ),
                h('button', { className: 'p-2 bg-policy-blue text-white rounded-xl hover:opacity-90 transition-opacity' },
                    h('span', { className: 'material-symbols-outlined', innerHTML: 'mail' })
                )
            )
        ),
        h('div', { className: 'flex flex-col items-center mb-10' },
            h('div', { className: `w-32 h-32 rounded-full border-4 border-policy-mint/20 mb-4 overflow-hidden shadow-sm flex items-center justify-center ${getInitialsColor(member.name)}` },
                h('span', { className: 'font-headline text-3xl font-bold' }, initials(member.name))
            ),
            h('h3', { className: 'font-headline text-headline-md font-bold text-on-surface mb-1 text-center' }, member.name),
            h('p', { className: 'font-body text-body-md text-policy-blue font-semibold mb-2' },
                member.role === 'Commissioner' ? `${member.commission} Commissioner` : `${member.commission} Fellow`
            ),
            h('div', { className: 'flex gap-2 flex-wrap justify-center' },
                member.where_from ? h('span', { className: 'px-2 py-1 bg-surface-container rounded-lg text-[10px] font-label-md text-on-surface-variant uppercase tracking-wider' }, member.where_from) : null,
                member.uni ? h('span', { className: 'px-2 py-1 bg-surface-container rounded-lg text-[10px] font-label-md text-on-surface-variant uppercase tracking-wider' }, member.uni) : null
            ),
            h('div', { className: 'flex gap-2 flex-wrap justify-center mt-3 text-[11px] text-on-surface-variant' },
                member.field_of_studies ? h('span', { className: 'px-2 py-1 bg-surface-subtle rounded-lg' }, member.field_of_studies) : null,
                member.companies ? h('span', { className: 'px-2 py-1 bg-surface-subtle rounded-lg' }, member.companies) : null
            )
        ),
        h('div', { className: 'mb-8' },
            h('h4', { className: 'font-label-md text-label-md text-policy-blue mb-3 uppercase tracking-widest' }, 'Biography'),
            h('p', { className: 'text-on-surface-variant leading-relaxed text-sm' }, member.bio || 'No biography available.')
        ),
        uniqueTags.length > 0 ? h('div', { className: 'mb-8' },
            h('h4', { className: 'font-label-md text-label-md text-policy-blue mb-3 uppercase tracking-widest' }, 'Expertise'),
            h('div', { className: 'flex flex-wrap gap-2' },
                ...uniqueTags.map(t => h('span', { className: 'px-3 py-1 bg-policy-blue/5 border border-policy-blue/20 rounded-lg text-xs text-policy-blue' }, t))
            )
        ) : null,
        articles.length > 0 ? h('div', { className: 'mb-8' },
            h('h4', { className: 'font-label-md text-label-md text-policy-blue mb-4 uppercase tracking-widest' }, 'Publications'),
            h('div', { className: 'space-y-3' },
                ...articles.map(a => h('div', { className: 'flex gap-3 items-start' },
                    h('div', { className: 'w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center shrink-0' },
                        h('span', { className: 'material-symbols-outlined text-sm text-policy-blue', innerHTML: 'description' })
                    ),
                    h('p', { className: 'text-xs font-semibold text-on-surface' }, a)
                ))
            )
        ) : null,
        h('div', { className: 'mt-auto pt-6 border-t border-border-low text-center' },
            h('p', { className: 'text-xs text-on-surface-variant' }, `${member.commission} • ${member.role}`)
        )
    );
}

// ===== SECTION RENDERERS =====
function renderDashboard(data) {
    const comm = data.commissions;
    const commissioners = data.commissioners;
    
    return h('div', { className: 'flex-grow pt-24 px-gutter pb-16 max-w-container-max mx-auto w-full' },
        // Welcome Section
        h('section', { className: 'mb-stack-lg flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4' },
            h('div', null,
                h('h2', { className: 'font-headline text-headline-lg-mobile md:text-headline-lg text-primary' }, 'The Voyce Member Portal'),
                h('p', { className: 'font-body text-body-md text-on-surface-variant mt-2 max-w-2xl' },
                    `${data.total_members} members across ${comm.length} commissions. Explore the network, browse knowledge, and connect.`
                )
            ),
            h('button', { className: 'bg-policy-blue text-on-primary px-4 py-2 rounded font-label-md text-label-md flex items-center gap-2 hover:bg-primary-container transition-colors shadow-sm', onClick: () => navigate('members', data) },
                h('span', { className: 'material-symbols-outlined text-sm', innerHTML: 'groups' }),
                'View All Members'
            )
        ),
        // Stats bar
        h('div', { className: 'grid grid-cols-2 md:grid-cols-4 gap-4 mb-stack-lg' },
            h('div', { className: 'bg-surface-container-lowest border border-border-low rounded-xl p-4' },
                h('p', { className: 'font-headline text-headline-md font-bold text-policy-blue' }, String(data.total_members)),
                h('p', { className: 'font-body-sm text-body-sm text-on-surface-variant' }, 'Total Members')
            ),
            h('div', { className: 'bg-surface-container-lowest border border-border-low rounded-xl p-4' },
                h('p', { className: 'font-headline text-headline-md font-bold text-policy-blue' }, String(comm.length)),
                h('p', { className: 'font-body-sm text-body-sm text-on-surface-variant' }, 'Active Commissions')
            ),
            h('div', { className: 'bg-surface-container-lowest border border-border-low rounded-xl p-4' },
                h('p', { className: 'font-headline text-headline-md font-bold text-policy-blue' }, String(Object.keys(commissioners).length)),
                h('p', { className: 'font-body-sm text-body-sm text-on-surface-variant' }, 'Commissioners')
            ),
            h('div', { className: 'bg-surface-container-lowest border border-border-low rounded-xl p-4' },
                h('p', { className: 'font-headline text-headline-md font-bold text-policy-blue' }, String(comm.reduce((s, c) => s + c.member_count - c.members.filter(m => m.role === 'Commissioner').length, 0))),
                h('p', { className: 'font-body-sm text-body-sm text-on-surface-variant' }, 'Fellows')
            )
        ),
        // Bento Grid
        h('div', { className: 'grid grid-cols-1 md:grid-cols-12 gap-6' },
            // Commissions Overview - Span 8
            h('div', { className: 'col-span-1 md:col-span-8 flex flex-col gap-4' },
                h('div', { className: 'flex items-center justify-between' },
                    h('h3', { className: 'font-headline text-headline-sm text-on-surface flex items-center gap-2' },
                        h('span', { className: 'material-symbols-outlined text-policy-blue', innerHTML: 'account_tree' }),
                        'Active Commissions'
                    ),
                    h('a', { className: 'font-label-md text-label-md text-policy-blue hover:underline cursor-pointer', onClick: () => navigate('members', data) }, 'View All')
                ),
                h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-4' },
                    ...comm.slice(0, 6).map(c => {
                        const commName = c.name;
                        return h('div', { className: 'bg-surface-container-lowest border border-border-low rounded-xl p-4 hover:border-policy-mint transition-colors group cursor-pointer flex flex-col', onClick: () => navigate('members', data) },
                            h('div', { className: 'flex justify-between items-start mb-3' },
                                h('span', { className: 'bg-surface-container px-2 py-1 rounded font-label-md text-label-md text-on-surface-variant' }, commName),
                                h('span', { className: 'material-symbols-outlined text-on-surface-variant group-hover:text-policy-blue transition-colors text-sm', innerHTML: 'arrow_forward' })
                            ),
                            h('h4', { className: 'font-body-lg text-body-lg font-semibold text-primary mb-2' }, c.commissioner || 'Commissioner'),
                            h('p', { className: 'font-body-sm text-body-sm text-on-surface-variant mb-4' }, `${c.member_count} members`),
                            h('div', { className: 'mt-auto flex items-center gap-2' },
                                ...c.members.slice(0, 3).map(m => {
                                    const cc = getInitialsColor(m.name);
                                    return h('div', { className: `w-7 h-7 rounded-full ${cc} flex items-center justify-center text-[10px] font-bold border border-white -mr-1.5`, title: m.name }, initials(m.name));
                                }),
                                c.members.length > 3 ? h('span', { className: 'font-body-sm text-body-sm text-on-surface-variant ml-1' }, `+${c.members.length - 3}`) : null
                            )
                        );
                    })
                )
            ),
            // Recent Activity / Pinned - Span 4
            h('div', { className: 'col-span-1 md:col-span-4 flex flex-col gap-4' },
                h('h3', { className: 'font-headline text-headline-sm text-on-surface flex items-center gap-2' },
                    h('span', { className: 'material-symbols-outlined text-tertiary-container', innerHTML: 'flag' }),
                    'Commission Leads'
                ),
                h('div', { className: 'bg-surface-container-lowest border border-border-low rounded-xl p-4 flex-grow flex flex-col gap-3' },
                    ...Object.entries(commissioners).slice(0, 8).map(([c, name]) =>
                        h('div', { className: 'flex items-center gap-3 p-3 rounded hover:bg-surface-subtle transition-colors cursor-pointer border border-transparent hover:border-border-low' },
                            h('div', { className: `w-8 h-8 rounded-full ${getInitialsColor(name)} flex items-center justify-center text-xs font-bold shrink-0` }, initials(name)),
                            h('div', { className: 'min-w-0' },
                                h('h5', { className: 'font-body-md text-body-md font-semibold text-primary truncate' }, name),
                                h('p', { className: 'font-body-sm text-body-sm text-on-surface-variant truncate' }, `${c} Commissioner`)
                            )
                        )
                    )
                )
            ),
            // Knowledge Hub Preview - Span 6
            h('div', { className: 'col-span-1 md:col-span-6 flex flex-col gap-4 mt-2' },
                h('div', { className: 'flex items-center justify-between' },
                    h('h3', { className: 'font-headline text-headline-sm text-on-surface flex items-center gap-2' },
                        h('span', { className: 'material-symbols-outlined text-policy-blue', innerHTML: 'menu_book' }),
                        'Knowledge Hub'
                    ),
                    h('a', { className: 'font-label-md text-label-md text-policy-blue hover:underline cursor-pointer', onClick: () => navigate('knowledge', data) }, 'Browse Hub')
                ),
                h('div', { className: 'bg-surface-container-lowest border border-border-low rounded-xl overflow-hidden' },
                    h('div', { className: 'bg-surface-container-low px-4 py-2 border-b border-border-low' },
                        h('span', { className: 'font-label-md text-label-md text-on-surface-variant' }, 'Featured resources from across commissions')
                    ),
                    h('div', { className: 'divide-y divide-border-low' },
                        ...['Policy Writing Standards', 'Research Methodology Guide', 'Commission Onboarding Kit', 'Outreach Templates'].map((title, i) =>
                            h('div', { className: 'flex items-center gap-3 p-3 hover:bg-surface-subtle transition-colors cursor-pointer', onClick: () => navigate('knowledge', data) },
                                h('div', { className: 'w-8 h-8 rounded bg-surface-subtle flex items-center justify-center text-on-surface-variant' },
                                    h('span', { className: 'material-symbols-outlined text-sm', innerHTML: ['description', 'analytics', 'book', 'campaign'][i] })
                                ),
                                h('div', { className: 'flex-1 min-w-0' },
                                    h('h4', { className: 'font-body-md text-body-md font-semibold text-on-surface truncate' }, title),
                                    h('p', { className: 'font-body-sm text-body-sm text-on-surface-variant' }, `${['Policy Commission', 'Research', 'Operations', 'Outreach'][i]} • Updated recently`)
                                ),
                                h('span', { className: 'material-symbols-outlined text-on-surface-variant text-sm', innerHTML: 'chevron_right' })
                            )
                        )
                    )
                )
            ),
            // Network Members Preview - Span 6
            h('div', { className: 'col-span-1 md:col-span-6 flex flex-col gap-4 mt-2' },
                h('div', { className: 'flex items-center justify-between' },
                    h('h3', { className: 'font-headline text-headline-sm text-on-surface flex items-center gap-2' },
                        h('span', { className: 'material-symbols-outlined text-policy-blue', innerHTML: 'hub' }),
                        'Recent Members'
                    ),
                    h('a', { className: 'font-label-md text-label-md text-policy-blue hover:underline cursor-pointer', onClick: () => navigate('members', data) }, 'View All')
                ),
                h('div', { className: 'bg-surface-container-lowest border border-border-low rounded-xl overflow-hidden' },
                    h('div', { className: 'divide-y divide-border-low' },
                        ...comm.flatMap(c => c.members).slice(0, 5).map(m =>
                            h('div', { className: 'flex items-center justify-between p-3 hover:bg-surface-subtle transition-colors cursor-pointer', onClick: () => openDrawer(m) },
                                h('div', { className: 'flex items-center gap-3 min-w-0' },
                                    h('div', { className: `w-9 h-9 rounded-full ${getInitialsColor(m.name)} flex items-center justify-center text-xs font-bold shrink-0 border border-border-low` }, initials(m.name)),
                                    h('div', { className: 'min-w-0' },
                                        h('h4', { className: 'font-body-md text-body-md font-semibold text-primary truncate' }, m.name),
                                        h('p', { className: 'font-body-sm text-body-sm text-on-surface-variant truncate' }, `${m.commission} • ${m.role}`)
                                    )
                                ),
                                h('span', { className: 'font-label-md text-label-md text-policy-blue shrink-0' }, 'View')
                            )
                        )
                    )
                )
            )
        )
    );
}

function renderMembersPage(data) {
    return h('div', { className: 'flex-1 relative overflow-auto p-6 md:p-10 canvas-grid', id: 'map-canvas' },
        // Center Node
        h('div', { className: 'absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2' },
            h('div', { className: 'w-20 h-20 md:w-24 md:h-24 rounded-full bg-policy-blue flex items-center justify-center text-white shadow-xl border-4 border-white z-10 relative' },
                h('span', { className: 'material-symbols-outlined text-3xl md:text-4xl', innerHTML: 'policy' }),
                h('div', { className: 'absolute inset-0 rounded-full border border-policy-blue node-pulse' })
            )
        ),
        // SVG connections
        (() => {
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute('class', 'absolute inset-0 w-full h-full pointer-events-none opacity-30');
            const positions = [
                { x: '30%', y: '20%' }, { x: '70%', y: '20%' },
                { x: '80%', y: '50%' }, { x: '70%', y: '80%' },
                { x: '30%', y: '80%' }, { x: '20%', y: '50%' },
                { x: '50%', y: '12%' }, { x: '50%', y: '88%' }
            ];
            positions.forEach(p => {
                const line = document.createElementNS(svgNS, "line");
                line.setAttribute('stroke', '#005566');

function navigateToCommission(data, commName) {
    navigate('directory', data);
    const waitForSelect = setInterval(() => {
        const select = document.getElementById('commission-filter');
        if (select) {
            select.value = commName;
            select.dispatchEvent(new Event('change'));
            clearInterval(waitForSelect);
        }
    }, 50);
    setTimeout(() => clearInterval(waitForSelect), 3000);
}

function filterDirectory() {
    const search = (document.getElementById('directory-search')?.value || '').toLowerCase();
    const commission = document.getElementById('commission-filter')?.value || '';
    const role = document.getElementById('role-filter')?.value || '';
    const rows = document.querySelectorAll('#directory-body tr');
    let count = 0;
    rows.forEach(row => {
        const text = (row.textContent + ' ' + (row.getAttribute('data-search') || '')).toLowerCase();
        const match = (!search || text.includes(search)) &&
            (!commission || text.includes(commission.toLowerCase())) &&
            (!role || text.includes(role.toLowerCase()));
        row.style.display = match ? '' : 'none';
        if (match) count++;
    });
    const countEl = document.getElementById('directory-count');
    if (countEl) countEl.textContent = `Showing ${count} of ${rows.length} members`;
}

        ),
        // Page containers
        ...pages.map(p => h('div', { className: `page flex flex-col flex-grow ${p === 'dashboard' ? 'active' : ''}`, id: `page-${p}` },
            p === 'dashboard' ? renderDashboard(data) :
            p === 'members' ? h('div', { className: 'ml-0 flex flex-col flex-grow relative' },
                h('header', { className: 'h-14 px-6 flex justify-between items-center bg-surface-container-lowest/80 backdrop-blur-md border-b border-border-low z-30 relative ml-0' },
                    h('div', { className: 'flex items-center gap-3' },
                        h('h2', { className: 'font-headline text-headline-sm text-policy-blue' }, 'Members Map'),
                        h('div', { className: 'h-4 w-[1px] bg-border-low' }),
                        h('nav', { className: 'flex gap-2' },
                            h('button', { className: 'px-3 py-1 bg-surface-container rounded-lg text-policy-blue font-label-md text-label-md border border-policy-blue/20 text-xs' }, 'Commission View'),
                            h('button', { className: 'px-3 py-1 hover:bg-surface-subtle rounded-lg text-on-surface-variant font-label-md text-label-md text-xs' }, 'Geographic View')
                        )
                    ),
                    h('div', { className: 'flex items-center gap-3' },
                        h('div', { className: 'relative hidden sm:block' },
                            h('span', { className: 'material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm', innerHTML: 'search' }),
                            h('input', { className: 'pl-9 pr-4 py-1.5 bg-surface-container border-none rounded-xl text-body-sm w-48 focus:ring-1 focus:ring-policy-blue text-xs', placeholder: 'Search members...', onKeyup: (e) => {
                                const term = e.target.value.toLowerCase();
                                document.querySelectorAll('#map-canvas > div:not(.absolute)').forEach(el => {
                                    el.style.opacity = '1';
                                });
                            }})
                        ),
                        h('button', { className: 'p-1.5 hover:bg-surface-subtle rounded-xl text-on-surface-variant', onClick: () => navigate('directory', data) },
                            h('span', { className: 'material-symbols-outlined', innerHTML: 'view_list' })
                        )
                    )
                ),
                renderMembersPage(data)
            ) :
            p === 'knowledge' ? renderKnowledgeHub(data) :
            renderStakeholderDirectory(data)
        )),
        // Mobile bottom nav
        h('nav', { className: 'md:hidden fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-border-low flex justify-around items-center h-16 z-50' },
            ...navItems.map(item =>
                h('a', { className: `nav-link flex flex-col items-center justify-center w-full h-full ${item.id === 'dashboard' ? 'text-policy-blue font-bold' : 'text-on-surface-variant'} cursor-pointer`, 'data-page': item.id, onClick: () => navigate(item.id, data) },
                    h('span', { className: 'material-symbols-outlined text-sm', innerHTML: item.icon }),
                    h('span', { className: 'font-label-md text-[10px] mt-0.5' }, item.label)
                )
            )
        )
    );

    // Drawer + Overlay
    const drawer = h('div', { className: 'fixed right-0 top-0 h-screen w-full max-w-[400px] bg-surface-container-lowest border-l border-border-low shadow-2xl z-[60] drawer-transition translate-x-full', id: 'member-drawer' },
        h('div', { className: 'h-full flex flex-col p-6 md:p-8 overflow-y-auto', id: 'drawer-content' })
    );
    const overlay = h('div', { className: 'fixed inset-0 bg-black/20 backdrop-blur-[2px] z-[55] opacity-0 pointer-events-none transition-opacity duration-300', id: 'drawer-overlay', onClick: closeDrawer });

    app.append(sidebar, main, drawer, overlay);

    // Mobile menu toggle
    window.toggleMobileMenu = function() {
        const s = document.querySelector('aside');
        if (s) {
            s.classList.toggle('hidden');
            s.classList.toggle('flex');
            s.classList.toggle('fixed');
            s.classList.toggle('z-[60]');
            s.classList.toggle('w-64');
        }
    };

    // Global search
    window.globalSearch = function(term, data) {
        term = (term || '').toLowerCase();
        const results = [];
        data.commissions.forEach(c => {
            c.members.forEach(m => {
                const haystack = [
                    m.name,
                    m.bio,
                    m.interests,
                    m.where_from,
                    m.uni,
                    m.field_of_studies,
                    m.companies
                ].filter(Boolean).join(' ').toLowerCase();
                if (haystack.includes(term)) {
                    results.push(m);
                }
            });
        });
        if (results.length > 0) {
            openDrawer(results[0]);
        }
    };

    // Init directory search
    setTimeout(() => {
        const searchInput = document.getElementById('directory-search');
        if (searchInput) {
            searchInput.addEventListener('input', filterDirectory);
        }
    }, 100);
}

// ===== STARTUP =====
init();
</script>
</body>
</html>
